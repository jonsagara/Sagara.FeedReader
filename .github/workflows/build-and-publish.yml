# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish
on: 
  workflow_dispatch:  # Allow running the workflow manually from the GitHub UI
  push:
    branches: 
      - 'main'        # Run the workflow when pushing to the main branch
      - 'release/**'  # Run the workflow when pushing to a release branch
  pull_request:
    branches:
      - '*'         # Run the workflow for all pull requests
  release:
    types:
      - published   # Run the workflow when a new GitHub release is published

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace }}/nuget

defaults:
  run:
    shell: pwsh

jobs:
  pack_nuget:
    name: dotnet pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read this workflow's runs to compute OfficialBuildId
      actions: read

    # Checkout the source code
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    - name: "Checkout source"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Install the .NET SDK indicated in the global.json file
    - name: Setup .NET SDK with global.json
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    # Sagara.Build.Versioning: compute OfficialBuildId (yyyyMMdd.N) from the run's creation date and the run's
    #   position among this workflow's runs that day. It stays the same across re-runs. Later steps see it as an
    #   environment variable, which MSBuild reads as a property and uses to compute FileVersion.
    - name: Compute OfficialBuildId
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
      run: |
        $inv = [System.Globalization.CultureInfo]::InvariantCulture
        $createdAt = gh api "repos/$env:REPO/actions/runs/$env:RUN_ID" --jq '.created_at'
        if ($LASTEXITCODE -ne 0) { throw "Could not read run $env:RUN_ID." }
        $created = [System.DateTimeOffset]::Parse($createdAt, $inv).UtcDateTime
        $day = $created.ToString('yyyy-MM-dd', $inv)
        $ids = gh api --paginate "repos/$env:REPO/actions/workflows/build-and-publish.yml/runs?created=${day}T00:00:00Z..${day}T23:59:59Z&per_page=100" --jq ".workflow_runs[] | select(.id <= $env:RUN_ID) | .id"
        if ($LASTEXITCODE -ne 0) { throw 'Could not list workflow runs.' }
        $n = @($ids | Where-Object { $_ }).Count
        if ($n -lt 1 -or $n -gt 99) { throw "Build of the day must be 1-99, but was $n." }
        $officialBuildId = '{0}.{1}' -f $created.ToString('yyyyMMdd', $inv), $n
        "OfficialBuildId=$officialBuildId" >> $env:GITHUB_ENV
        "OfficialBuildId: $officialBuildId"

    # Create the NuGet package in the folder from the environment variable NuGetDirectory
    - name: dotnet pack Sagara.FeedReader
      run: dotnet pack ./src/Sagara.FeedReader/Sagara.FeedReader.csproj --configuration Release --output ${{ env.NuGetDirectory }}

    # Upload .nupkg files as an artifact, so they can be used in the following jobs
    - name: Upload NuGet packages as artifacts
      if: github.event_name == 'release'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nuget
        if-no-files-found: error
        retention-days: 1
        path: ${{ env.NuGetDirectory }}/*

    # Upload global.json as an artifact so that we don't have to check out the whole repo to publish to nuget.
    - name: Upload global.json as artifact
      if: github.event_name == 'release'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: globaljson
        if-no-files-found: error
        retention-days: 1
        path: ${{ github.workspace }}/global.json

  run_test:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install the .NET SDK indicated in the global.json file
      # Even though the prior STS and LTS versions are pre-installed on the runner, explicitly list
      #   them here for clarity. We need their runtimes to execute their tests.
      - name: Setup .NET SDK with global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
          
      # Only run the unit tests, NOT the integration intests that download from tens of feeds.
      - name: Run tests
        run: dotnet test src/Sagara.FeedReader.Tests.Unit/Sagara.FeedReader.Tests.Unit.csproj --configuration Release

  deploy_packages:
    # Publish only when creating a GitHub Release
    # https://docs.github.com/en/repositories/releasing-projects-on-github/managing-releases-in-a-repository
    # You can update this logic if you want to manage releases differently
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [ pack_nuget, run_test ]
    permissions:
      # Enable GitHub OIDC token issuance for this job
      id-token: write
    steps:
      # Download the NuGet package created in the pack job
      - name: Download NuGet package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      # Download the global.json file uploaded in the pack job
      - name: Download NuGet package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: globaljson
          path: ${{ github.workspace }}

      # Install the .NET SDK indicated in the global.json file
      - name: Setup .NET SDK with global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Get a short-lived API key
      - name: NuGet login (OIDC)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with: 
          # nuget.org username, NOT email address
          user: ${{ secrets.NUGET_USER }}

      # Publish all NuGet .nupkg files to NuGet.
      # Use --skip-duplicate to prevent errors if a package with the same version already exists.
      # If you retry a failed workflow, already published packages will be skipped without error.
      - name: Publish package (.nupkg) files
        run: |
          foreach ($file in (Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg)) {
            $file
            dotnet nuget push $file --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
